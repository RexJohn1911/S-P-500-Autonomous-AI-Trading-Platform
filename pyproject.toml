[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-autonomous-ai-trading-system"
version = "0.1.0"
description = "Autonomous AI Quantitative Trading Platform for S&P 500"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Quant AI Engineering" }]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]
asyncio_mode = "auto"
